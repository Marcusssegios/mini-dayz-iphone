name: Publicar Mini DayZ iPhone
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Descargar la versión base 2.0.8
        run: |
          python3 - <<'PY'
          import urllib.request,zipfile,io,os
          url='https://raw.githubusercontent.com/DorinelMDZ/Mini-DayZ-IOS-PC/main/www.zip'
          data=urllib.request.urlopen(url,timeout=120).read()
          os.makedirs('site',exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              for item in z.infolist():
                  dest=os.path.realpath(os.path.join('site',item.filename))
                  if not dest.startswith(os.path.realpath('site')+os.sep): raise ValueError('Invalid ZIP path')
              z.extractall('site')
          roots=list(__import__('pathlib').Path('site').rglob('index.html'))
          if not roots: raise RuntimeError('No se encontró index.html dentro del ZIP')
          root=roots[0].parent
          if root.resolve()!=__import__('pathlib').Path('site').resolve():
              import shutil
              temp=__import__('pathlib').Path('site_flat')
              shutil.copytree(root,temp)
              shutil.rmtree('site')
              temp.rename('site')
          print('Archivos preparados:',len(os.listdir('site')))
          PY
      - name: Evitar caché antigua y añadir recuperación
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          s=p.read_text(encoding='utf-8')
          script="""<script>
          // No borrar datos de partidas. Desregistrar service workers antiguos.
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
          }
          window.addEventListener('load',()=>{
            setTimeout(()=>{
              const b=document.createElement('button');
              b.textContent='¿No carga? Reiniciar sin caché';
              b.style.cssText='position:fixed;right:12px;bottom:12px;z-index:999999;padding:12px;background:#202020;color:white;border:1px solid #aaa;border-radius:8px;font:14px sans-serif';
              b.onclick=async()=>{
                if('caches' in window) for(const k of await caches.keys()) await caches.delete(k);
                location.reload();
              };
              document.body.appendChild(b);
            },30000);
          });
          </script>"""
          diagnostic="""<script>
          (function(){
            var errors=[];
            function record(s){errors.push(String(s).slice(0,250));if(errors.length>8)errors.shift();}
            window.addEventListener('error',function(e){
              record(e.message||('Recurso: '+(e.target&&e.target.src||e.target&&e.target.href||'desconocido')));
            },true);
            window.addEventListener('unhandledrejection',function(e){record('Promesa: '+String(e.reason));});
            window.addEventListener('DOMContentLoaded',function(){
              setTimeout(function(){
                var panel=document.createElement('div');
                panel.style.cssText='position:fixed;top:8px;left:8px;right:8px;z-index:2147483647;background:#101820ee;color:white;padding:12px;font:12px monospace;border:2px solid #ffc107;border-radius:8px;max-height:45vh;overflow:auto';
                var heading=document.createElement('div');heading.textContent='DIAGNÓSTICO MINI DAYZ | Safari';
                var details=document.createElement('pre');details.style.whiteSpace='pre-wrap';
                var btn=document.createElement('button');btn.textContent='Copiar diagnóstico';
                btn.onclick=function(){var t=details.textContent;navigator.clipboard&&navigator.clipboard.writeText(t);};
                var close=document.createElement('button');close.textContent='Ocultar';close.onclick=function(){panel.remove();};
                panel.append(heading,details,btn,close);document.body.appendChild(panel);
                setInterval(function(){
                  details.textContent='URL: '+location.pathname+'\\nPantalla: '+innerWidth+'x'+innerHeight+'\\nErrores: '+(errors.join('\\n')||'No detectados')+'\\nScripts: '+document.scripts.length;
                },1000);
              },12000);
            });
          })();
          </script>"""
          s=s.replace('</head>',diagnostic+'</head>')
          s=s.replace('</body>',script+'</body>')
          s=s.replace('offlineClient.js','offlineClient-disabled.js')
          # Replace the whole jQuery ready callback; previous patch nested the button inside it.
          import re
          pattern=r'jQuery\(document\)\.ready\(function \(\)\s*\{[\s\S]*?\}\);'
          gate="""<script>
          (function(){
            var started=false;
            var button=document.createElement('button');
            button.id='start-game-iphone';
            button.textContent='▶ JUGAR MINI DAYZ';
            button.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2147483646;background:#1b321c;color:white;border:3px solid #a5cf7b;border-radius:14px;padding:20px;font:bold 20px Arial;box-shadow:0 0 0 100vmax rgba(0,0,0,.85)';
            document.body.appendChild(button);
            button.addEventListener('click',function(){
              if(started)return;
              started=true;button.remove();
              try { cr_createRuntime('c2canvas'); }
              catch(e){ alert('No se pudo iniciar: '+e.message);throw e; }
            });
          })();
          </script>"""
          s,count=re.subn(pattern,'/* Inicio manual desde Safari */',s,count=1)
          if count!=1: raise RuntimeError('No se encontró el bloque de inicio automático')
          s=s.replace('</body>',gate+'</body>')
          # Do not let the Construct 2 runtime register the broken offline service worker.
          s=s.replace('window.C2_RegisterSW = function C2_RegisterSW()', 'window.C2_RegisterSW = function C2_RegisterSW_DISABLED()')
          # Keep a separate uncached path, outside the old SW's precache manifest.
          p.write_text(s,encoding='utf-8')
          import shutil
          fresh=Path('site/iphone-v3')
          shutil.copytree('site',fresh,ignore=shutil.ignore_patterns('iphone-v3'))
          # New entrypoint can be visited directly, bypassing cached index.html.
          (Path('site')/'play-v3.html').write_text('<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>location.replace("./iphone-v3/index.html")</script><a href="./iphone-v3/index.html">Jugar</a>',encoding='utf-8')
          Path('site/.nojekyll').touch()
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
