name: Reparar y publicar Mini DayZ iPhone
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reconstruir juego con inicio forzado al menú real
        run: python3 scripts/prepare.py
      - name: Probar arranque automáticamente en Chrome
        run: |
          npm install --no-save playwright-core@1.56.1 pngjs@7.0.0
          python3 -m http.server 8975 --directory site >/tmp/mini-dayz-server.log 2>&1 &
          sleep 2
          node scripts/verify.mjs
          npx playwright-core install --with-deps webkit
          node scripts/verify-webkit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-dayz-diagnostic
          path: site/ci*.png
          retention-days: 2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
